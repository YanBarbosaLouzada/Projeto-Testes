name: Backend CI

on:
  push:
    branches: ["master", "testes"]   # use o nome da SUA branch principal (neste repositório é "master")
    paths: ["Backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: ["master", "testes"]
    paths: ["Backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"            # a mesma versão do Dockerfile (node:20-alpine)
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Rodar lint (se configurado)
        run: npm run lint --if-present

      - name: Rodar testes com cobertura
        run: npm run test:coverage
        env:
          JWT_SECRET: test-only-jwt-secret-at-least-32-characters-123456789
          # dbUrl não é necessário aqui: os testes de unidade usam mocks (Aula 3)
          # e os de integração sobem seu próprio MongoDB em memória (Aula 4) —
          # nenhum dos dois depende do MongoDB Atlas real.

      - name: Validar fluxo contra API real
        run: |
          node src/server.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4444/products/ > /dev/null; then
              npm run test:system
              exit $?
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              wait "$server_pid"
              exit 1
            fi
            sleep 1
          done
          echo "A API não ficou disponível dentro de 30 segundos."
          exit 1
        env:
          NODE_ENV: test
          dbUrl: mongodb://127.0.0.1:27017/mynds-sistema
          PORT: 4444
          JWT_SECRET: test-only-jwt-secret-at-least-32-characters-123456789
          SYSTEM_BASE_URL: http://127.0.0.1:4444

      - name: Publicar relatório de cobertura como artefato
        if: always()                    # publica o relatório MESMO se o passo anterior falhar
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: Backend/coverage/

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    
  backend:
    build: .
    environment:
      - dbUrl=mongodb://mongo:27017/mynds-sistema
      - PORT=4444
      - JWT_SECRET=test-only-jwt-secret-at-least-32-characters-123456789
      - CORS_ORIGINS=http://localhost:5173
    ports:
      - "4444:4444"
    depends_on:
      - mongo